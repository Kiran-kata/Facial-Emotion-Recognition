<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmoSense · Facial Emotion AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <!-- ── Nav bar ────────────────────────────────────────────────── -->
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="14" cy="14" r="13" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="10" cy="12" r="2" fill="currentColor"/>
          <circle cx="18" cy="12" r="2" fill="currentColor"/>
          <path d="M9 18.5c1.2 2 8.8 2 10 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">EmoSense</span>
      </div>
      <span class="brand-tag">Facial Emotion AI</span>
    </div>
  </nav>

  <!-- ── Hero ───────────────────────────────────────────────────── -->
  <section class="hero">
    <h1 class="hero-title">Read Emotions in Real Time</h1>
    <p class="hero-sub">Point your camera. See what faces say.</p>
  </section>

  <!-- ── Main card ──────────────────────────────────────────────── -->
  <main>
    <!-- Segmented control -->
    <div class="seg-control">
      <button class="seg-btn active" data-tab="webcam">
        <svg viewBox="0 0 20 20" fill="none"><rect x="2" y="4" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 17h6M10 15v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Webcam
      </button>
      <button class="seg-btn" data-tab="upload">
        <svg viewBox="0 0 20 20" fill="none"><path d="M10 3v9M6 7l4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 14v1a2 2 0 002 2h10a2 2 0 002-2v-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Upload
      </button>
    </div>

    <!-- ── Webcam panel ────────────────────────────────────────── -->
    <section id="webcam-panel" class="panel active">
      <div class="split-layout">
        <div class="split-left">
          <div class="video-wrapper">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="overlay" aria-hidden="true"></canvas>
            <div class="video-placeholder" id="videoPlaceholder">
              <svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="18" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M8 40c0-8.837 7.163-16 16-16s16 7.163 16 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              <span>Camera not started</span>
            </div>
          </div>
          <div class="controls">
            <button id="startBtn" class="btn primary">
              <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M8 7l5 3-5 3V7z" fill="currentColor"/></svg>
              Start Camera
            </button>
            <button id="captureBtn" class="btn" disabled>
              <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M2 10a8 8 0 1016 0A8 8 0 002 10z" stroke="currentColor" stroke-width="1.5"/></svg>
              Capture
            </button>
            <button id="liveBtn" class="btn" disabled>
              <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="3" fill="currentColor"/><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/></svg>
              <span id="liveBtnText">Live: OFF</span>
            </button>
          </div>
        </div>
        <div class="split-right" id="webcamResults">
          <div class="results-placeholder">
            <svg viewBox="0 0 48 48" fill="none"><path d="M6 12h36M6 24h24M6 36h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <p>Results will appear here</p>
          </div>
        </div>
      </div>
    </section>

    <!-- ── Upload panel ────────────────────────────────────────── -->
    <section id="upload-panel" class="panel">
      <div class="split-layout">
        <div class="split-left">
          <label class="drop-zone" id="dropZone">
            <div id="dropContent" class="drop-content">
              <svg viewBox="0 0 48 48" fill="none"><path d="M24 8v24M14 18l10-10 10 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 36v2a2 2 0 002 2h28a2 2 0 002-2v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              <p class="drop-title">Drop an image here</p>
              <p class="drop-sub">or click to browse &middot; JPG, PNG, WebP</p>
            </div>
            <input type="file" id="fileInput" accept="image/*" hidden />
          </label>
          <button id="analyseUploadBtn" class="btn primary full-width" disabled>
            <svg viewBox="0 0 20 20" fill="none"><path d="M10 2a8 8 0 100 16A8 8 0 0010 2z" stroke="currentColor" stroke-width="1.5"/><path d="M7 10l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Analyse
          </button>
        </div>
        <div class="split-right" id="uploadResults">
          <div class="results-placeholder">
            <svg viewBox="0 0 48 48" fill="none"><path d="M6 12h36M6 24h24M6 36h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <p>Results will appear here</p>
          </div>
        </div>
      </div>
    </section>

    <div id="spinner" class="spinner" hidden>
      <div class="spin-ring"></div>
      <span>Analysing&hellip;</span>
    </div>
    <p id="error-msg" class="error-msg" hidden></p>
  </main>

  <footer>
    <p>EmoSense &middot; 8 emotion classes &middot; 87.6% accuracy on FER+</p>
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
